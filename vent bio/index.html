<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@sanity.</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="rectangle">
        <div class="avatar-section">
            <div class="avatar">
                <img src="avatar.webp" alt="Avatar">
            </div>
            <div class="info">
                <h2 class="name">sanity.</h2>
                <p class="description">
                    <span id="animated-text"></span>
                    <span class="cursor">|</span>
                </p>
            </div>
        </div>
        
        <div class="links-section">
            <div class="links-grid">
                <a href="#" class="link-card youtube">
                    <i class="fab fa-youtube"></i>
                    <span>YouTube</span>
                </a>
                <a href="#" class="link-card instagram">
                    <i class="fab fa-instagram"></i>
                    <span>Instagram</span>
                </a>
                <a href="#" class="link-card twitter">
                    <i class="fab fa-twitter"></i>
                    <span>Twitter</span>
                </a>
                <a href="#" class="link-card github">
                    <i class="fab fa-github"></i>
                    <span>GitHub</span>
                </a>
                <a href="#" class="link-card discord">
                    <i class="fab fa-discord"></i>
                    <span>Discord</span>
                </a>
                <a href="#" class="link-card portfolio">
                    <i class="fas fa-globe"></i>
                    <span>Portfolio</span>
                </a>
            </div>
        </div>
        
        <div class="footer-text">
            <p><img src="rocket-icon.png" alt="🚀" class="footer-icon"> Creating digital experiences <span class="separator">|</span> <img src="code-icon.png" alt="💻" class="footer-icon"> Building the future <span class="separator">|</span> <img src="sparkle-icon.png" alt="✨" class="footer-icon"> Spreading creativity</p>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
